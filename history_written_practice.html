<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fffaf4">
<meta name="description" content="중학교 역사 서답형 25문제. 단원별 연습과 전체 풀이, 제출 후 모범답안 비교, 자기 점검을 지원하는 학습 페이지입니다.">
<title>역사 한 문장 · 서답형 25문제</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23e66d2a'/%3E%3Cpath d='M32 17v33M32 17C23 11 13 14 10 16v31c9-4 16-1 22 3 6-4 13-7 22-3V16c-3-2-13-5-22 1Z' stroke='white' fill='none' stroke-width='3.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fffaf4;--paper:#fff;--ink:#3b312a;--muted:#82766b;--line:#ecdfd2;
  --orange:#c44d14;--orange-bright:#e66d2a;--orange-deep:#a44012;
  --peach:#fff0df;--pale:#fff8ef;--green:#39705d;--green-bg:#edf5ef;
  --font:"Comic Sans MS","Comic Neue","Gowun Dodum","Malgun Gothic","Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;
  --shadow:0 10px 28px rgba(102,63,26,.05);--radius:22px
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:100px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
button,textarea,input,select{font:inherit}
button,a,label,input,textarea{-webkit-tap-highlight-color:transparent}
button{cursor:pointer;color:inherit;border:0;background:none}
button:disabled{cursor:not-allowed;opacity:.38}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{
  outline:3px solid #b85c25;outline-offset:4px
}
button{touch-action:manipulation}
h1,h2,h3,p{margin:0}
h1,h2,h3{line-height:1.45}
svg.icon{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:fixed;top:-70px;left:20px;background:var(--ink);color:white;padding:10px 18px;border-radius:8px;z-index:100}
.skip-link:focus{top:12px}
.site-header{height:82px;border-bottom:1px solid var(--line);background:rgba(255,250,244,.98)}
.header-inner{max-width:1192px;margin:0 auto;padding:0 30px;height:100%;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:inline-flex;align-items:center;gap:12px;font-size:23px;font-weight:700;letter-spacing:-.7px;padding:0}
.brand-mark{display:grid;place-items:center;width:42px;height:42px;background:var(--orange-bright);border-radius:13px;color:white;transform:rotate(-5deg)}
.brand-mark .icon{width:26px;height:26px;transform:rotate(5deg)}
.header-meta{display:flex;align-items:center;gap:18px;color:var(--muted);font-size:13px}
.save-status{display:flex;align-items:center;gap:6px}
.save-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.save-status.warn .save-dot{background:var(--orange)}
.exam-label{padding:4px 12px;border:1px solid var(--line);border-radius:999px;color:#786352}
main{max-width:1192px;margin:auto;padding:42px 30px 48px;min-height:calc(100vh - 170px)}
button.btn{display:inline-flex;justify-content:center;align-items:center;gap:9px;padding:12px 20px;border:1px solid var(--line);border-radius:13px;min-height:47px;font-weight:700;font-size:15px;line-height:1.5;transition:transform .14s,background .14s,box-shadow .14s;background:var(--paper)}
button.btn:hover:not(:disabled){background:var(--pale);transform:translateY(-1px)}
button.btn.primary{background:var(--orange);border-color:var(--orange);color:white;box-shadow:0 4px 0 #9d3c13}
button.btn.primary:hover:not(:disabled){background:var(--orange-deep)}
button.btn.light{background:var(--peach);border-color:#f2d9bd;color:var(--orange-deep)}
button.btn.ghost{border-color:transparent;background:transparent;box-shadow:none;color:var(--muted)}
button.btn.small{padding:8px 13px;min-height:40px;font-size:13px;border-radius:10px}
button.btn.wide{width:100%}
button.btn.danger{background:#a54129;border-color:#a54129;color:white}
.link-button{display:inline-flex;align-items:center;gap:7px;color:var(--muted);padding:4px 0;font-size:14px}
.link-button:hover{color:var(--orange)}
.eyebrow{display:inline-flex;align-items:center;gap:7px;color:var(--orange-deep);font-size:13px;font-weight:700;letter-spacing:.5px}
.eyebrow .icon{width:16px;height:16px}
.pill{padding:5px 12px;border-radius:999px;background:var(--peach);border:1px solid #f2dac1;font-size:13px}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:45px;align-items:center;padding:8px 0 34px}
.hero h1{font-size:49px;letter-spacing:-1.6px;line-height:1.34;margin:19px 0 17px}
.hero h1 em{font-style:normal;color:var(--orange);position:relative}
.hero h1 em:after{content:"";position:absolute;left:0;bottom:-2px;right:0;height:5px;border-bottom:3px solid #f1c38e;border-radius:50%;transform:rotate(-1deg)}
.hero-description{font-size:16px;color:#7d6f61;line-height:1.95;max-width:510px}
.hero-side{padding:23px 0 0 24px;position:relative}
.paper-note{position:relative;background:#fff0de;border:1px solid #f1d8b6;border-radius:19px;padding:24px 27px 21px;transform:rotate(1.5deg);box-shadow:8px 9px 0 #f6e7d7}
.paper-note:before{content:"";position:absolute;width:76px;height:24px;top:-13px;left:calc(50% - 38px);background:#ecc69ab3;transform:rotate(-5deg);border:1px solid #e8bf9066}
.paper-note h2{font-size:16px;font-weight:400;color:#8b6b4e}
.note-big{font-size:57px;letter-spacing:-3px;line-height:1.4;color:var(--orange);margin:4px 0 6px;font-weight:700}
.note-rule{border-top:1px dashed #d6b493;padding-top:14px;display:flex;align-items:flex-start;gap:8px;font-size:14px;color:#87664b}
.note-rule .icon{margin-top:2px;width:18px;height:18px}
.hero-side-caption{display:flex;justify-content:flex-end;align-items:center;gap:6px;font-size:12px;color:#987d63;margin:19px 7px 0}
.study-strip{display:flex;align-items:center;justify-content:space-between;gap:22px;background:var(--paper);border:1px solid var(--line);padding:23px 27px;border-radius:19px;box-shadow:var(--shadow);margin:3px 0 37px}
.strip-stats{display:flex;gap:0;align-items:center}
.strip-stat{padding:0 24px;border-right:1px solid var(--line)}
.strip-stat:first-child{padding-left:0}
.strip-stat:last-child{border-right:0}
.strip-stat strong{font-size:29px;font-weight:700;line-height:1.2;color:var(--ink)}
.strip-stat strong span{font-size:15px;margin-left:4px;font-weight:400}
.strip-stat p{font-size:12px;color:var(--muted);margin-top:3px}
.strip-callout{text-align:right}
.strip-callout .btn{padding:13px 20px}
.strip-callout p{font-size:11px;color:var(--muted);margin-top:8px}
.section-title-row{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:16px}
.section-title-row h2{font-size:23px;letter-spacing:-.6px}
.section-title-row p{font-size:13px;color:var(--muted)}
.units-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.unit-card{background:var(--paper);border:1px solid var(--line);border-radius:19px;padding:20px 17px 16px;display:flex;flex-direction:column;position:relative;min-width:0;box-shadow:var(--shadow)}
.unit-card:hover{border-color:#e7bc98}
.unit-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.unit-no{font-size:18px;color:var(--orange);font-weight:700;letter-spacing:1px}
.question-count{font-size:12px;color:var(--muted)}
.unit-card h3{font-size:18px;letter-spacing:-.6px;min-height:55px}
.unit-page{display:inline-flex;font-size:12px;color:#9a7c62;margin-top:8px}
.unit-caption{font-size:12px;color:var(--muted);line-height:1.7;margin:11px 0 17px;min-height:41px}
.mini-progress{height:4px;border-radius:99px;overflow:hidden;background:#f3ebe2;margin-bottom:7px}
.mini-progress span{display:block;height:100%;background:#e58b51}
.card-status{font-size:11px;color:var(--muted);margin-bottom:13px}
.unit-card .btn{margin-top:auto}
.home-footer-note{display:flex;justify-content:space-between;gap:16px;color:#897a6d;font-size:12px;margin-top:18px}
.home-footer-note span{display:flex;gap:6px;align-items:center}
.home-footer-note .icon{width:15px;height:15px}
.resume-bar{border:1px dashed #d6b496;background:#fff5e8;border-radius:14px;display:flex;align-items:center;justify-content:space-between;padding:13px 17px;margin:0 0 25px;gap:15px}
.resume-bar strong{font-size:14px}
.resume-bar p{font-size:12px;color:var(--muted)}
.footnote-box{margin-top:33px;border-top:1px solid var(--line);padding-top:18px;color:#8e7f71;font-size:12px}
.footnote-box summary{cursor:pointer;display:inline-block;color:#7f6c5b}
.footnote-box p{margin-top:10px;line-height:1.9}
.page-topline{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}
.page-topline .small-note{font-size:12px;color:var(--muted)}
.practice-heading{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}
.practice-heading h1{font-size:28px;letter-spacing:-.8px;margin-top:5px}
.practice-heading .counter{flex:none;padding:9px 15px;background:var(--peach);border-radius:12px;font-size:14px;color:var(--orange-deep)}
.workspace{display:grid;grid-template-columns:239px minmax(0,1fr);gap:24px;align-items:start}
.sidebar{position:sticky;top:22px}
.nav-panel{border:1px solid var(--line);background:var(--paper);padding:19px;border-radius:19px}
.nav-panel h2{font-size:15px;margin-bottom:12px}
.nav-stats{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}
.nav-stats strong{color:var(--orange)}
.main-progress{height:6px;background:#f5ece2;border-radius:10px;overflow:hidden}
.main-progress span{display:block;background:var(--orange-bright);height:100%;border-radius:10px;transition:width .2s}
.question-nav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:18px}
.q-number{padding:0;white-space:nowrap;word-break:normal;overflow-wrap:normal;line-height:1;min-width:0;aspect-ratio:1;min-height:33px;display:grid;place-items:center;position:relative;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:15px;font-weight:700}
.q-number.answered{color:var(--orange-deep);background:var(--peach);border-color:#efcfad}
.q-number.current{outline:2px solid var(--orange);outline-offset:2px}
.q-number.flagged:after{content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;background:var(--ink);border-radius:50%}
.nav-legend{margin-top:17px;display:flex;flex-wrap:wrap;gap:7px 10px;font-size:10px;color:var(--muted)}
.nav-legend span{display:flex;align-items:center;gap:4px}
.legend-dot{display:inline-block;width:9px;height:9px;border-radius:3px;border:1px solid var(--line)}
.legend-dot.done{background:var(--peach);border-color:#eabe96}
.legend-dot.now{border:2px solid var(--orange)}
.legend-dot.marked{border:0;background:var(--ink);border-radius:50%;width:5px;height:5px}
.sidebar-note{padding:18px 12px;font-size:12px;color:#8a7662;line-height:1.9}
.sidebar-note h3{display:flex;align-items:center;gap:7px;font-size:13px;color:#755e48;margin-bottom:7px}
.sidebar-note .icon{width:16px;height:16px}
.sidebar-note p+p{margin-top:7px}
.question-card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:28px 32px 26px;box-shadow:var(--shadow)}
.question-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:17px}
.question-tag{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.question-tag strong{font-size:15px;color:var(--orange);letter-spacing:.8px}
.question-tag span{font-size:11px;color:var(--muted)}
.flag-btn{display:flex;align-items:center;gap:5px;border-radius:9px;padding:6px 8px;font-size:12px;color:var(--muted);white-space:nowrap}
.flag-btn .icon{width:16px;height:16px}
.flag-btn:hover,.flag-btn.active{background:var(--peach);color:var(--orange-deep)}
.flag-btn.active .icon{fill:#f8ddbd}
.question-title{font-size:15px;color:#8e7966;font-weight:400;margin-bottom:9px}
.question-prompt{font-size:22px;line-height:1.75;font-weight:700;letter-spacing:-.45px}
.quote-box{margin:20px 0 0;background:#faf6f0;border:1px solid var(--line);border-left:3px solid #cfa076;border-radius:10px;padding:18px 20px;font-size:17px;line-height:1.85}
.answer-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 10px;font-size:14px}
.answer-header label{font-weight:700}
.answer-header span{font-size:11px;color:#978575}
.answer-input{width:100%;resize:vertical;min-height:215px;padding:17px 19px;border:1.5px solid #e2cdb8;border-radius:14px;background:#fffdfa;color:var(--ink);font-size:17px;line-height:2;display:block}
.answer-input::placeholder{color:#aa9a8c;font-size:15px}
.answer-input:focus{border-color:var(--orange)}
.answer-helper{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;font-size:11px;color:var(--muted);margin:8px 2px 0;min-height:22px}
.answer-helper .good{color:var(--green)}
.answer-helper .warning{color:var(--orange-deep)}
.answer-helper .count{white-space:nowrap}
.question-controls{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid #f0e5da;padding-top:20px;margin-top:21px}
.question-position{font-size:13px;color:var(--muted)}
.submit-row{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:17px;padding:0 2px}
.submit-row p{font-size:12px;color:var(--muted)}
.submit-row p strong{font-weight:400;color:var(--orange-deep)}
.results-heading h1{font-size:34px;letter-spacing:-1px;margin:8px 0 10px}
.results-heading>p{font-size:15px;color:var(--muted);max-width:800px}
.results-toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0 25px}
.self-summary{background:var(--paper);border:1px solid var(--line);border-radius:19px;padding:22px;display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:25px}
.self-stat{border-right:1px solid var(--line);text-align:center}
.self-stat:last-child{border:0}
.self-stat strong{display:block;font-size:30px;line-height:1.3}
.self-stat span{font-size:12px;color:var(--muted)}
.self-stat:nth-child(1) strong{color:var(--green)}
.self-stat:nth-child(2) strong{color:#bc7026}
.self-stat:nth-child(3) strong{color:#ab5338}
.self-stat:nth-child(4) strong{color:#8e8074}
.summary-caption{font-size:11px;color:var(--muted);margin:10px 2px 22px}
.result-filter-row{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:24px 0 17px}
.filter-bar{display:flex;gap:7px;flex-wrap:wrap}
.filter-btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 13px;font-size:13px}
.filter-btn.active{background:var(--ink);color:white;border-color:var(--ink)}
.filtered-count{font-size:12px;color:var(--muted);white-space:nowrap}
.result-list{display:flex;flex-direction:column;gap:22px}
.result-card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:25px 27px;box-shadow:var(--shadow)}
.result-card .question-meta{margin-bottom:10px}
.result-card h2{font-size:19px;line-height:1.8}
.result-card .quote-box{font-size:15px;padding:12px 16px;margin-top:13px}
.answer-comparison{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.answer-panel{border:1px solid var(--line);background:#fffdfa;border-radius:13px;padding:18px 20px;min-width:0}
.answer-panel.model{background:#fff5e8;border-color:#edceac}
.panel-label{font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:9px}
.panel-label .icon{width:15px;height:15px}
.model .panel-label{color:var(--orange-deep)}
.answer-panel p{font-size:15px;line-height:1.95;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal}
.sentence-note{font-size:11px;color:var(--orange-deep);margin-top:11px}
.criteria-box{margin-top:20px}
.criteria-heading{font-size:13px;margin-bottom:8px}
.criteria-heading span{font-size:11px;color:var(--muted);font-weight:400;margin-left:8px}
.criteria-list{display:flex;flex-direction:column;gap:7px}
.criterion{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:#776555;cursor:pointer;line-height:1.8;padding:2px 0}
.criterion input{width:17px;height:17px;accent-color:var(--orange);margin:4px 0 0;flex:none;cursor:pointer}
.result-note{margin-top:13px;font-size:12px;color:#876b51;border-left:2px solid #dec2a6;padding-left:10px;line-height:1.9}
.self-grade-row{display:flex;justify-content:space-between;align-items:center;gap:13px;border-top:1px solid var(--line);padding-top:16px;margin-top:18px}
.self-grade-row>span{font-size:12px;color:var(--muted)}
.grade-buttons{display:flex;gap:7px;flex-wrap:wrap}
.grade-btn{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:9px;font-size:12px;padding:8px 11px;min-height:37px}
.grade-btn .icon{width:15px;height:15px}
.grade-btn.selected[data-grade="good"]{background:var(--green-bg);border-color:#82ae96;color:#2a604d}
.grade-btn.selected[data-grade="improve"]{background:#fff1d9;border-color:#d4a365;color:#8c531c}
.grade-btn.selected[data-grade="retry"]{background:#faeae4;border-color:#d5a18d;color:#8f442d}
.grade-hint{margin-top:10px;font-size:11px;color:var(--orange-deep)}
.improve-note{margin-top:16px}
.improve-note summary{font-size:12px;color:#8a6e54;cursor:pointer}
.improve-input{margin-top:9px;width:100%;min-height:91px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.8;background:#fffdf9}
.results-bottom{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:30px}
.empty-state{text-align:center;padding:50px 20px;background:var(--paper);border:1px dashed #d6c2ac;border-radius:20px;color:var(--muted)}
.empty-state h2{font-size:20px;color:var(--ink);margin-bottom:8px}
.empty-state p{font-size:14px}
.empty-state .btn{margin-top:18px}
footer.site-footer{max-width:1132px;margin:0 auto;padding:21px 0 28px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:20px;font-size:11px;color:#978777}
.footer-name{font-size:13px;color:#8c6b50}
.dialog{border:1px solid var(--line);border-radius:22px;padding:28px 29px;width:min(470px,calc(100% - 32px));color:var(--ink);background:var(--bg);font-family:var(--font);box-shadow:0 24px 80px #33201033}
.dialog::backdrop{background:#33291e77;backdrop-filter:blur(3px)}
.dialog h2{font-size:23px;margin-bottom:12px}
.dialog p{font-size:15px;line-height:1.95;color:#786655;white-space:pre-line}
.dialog-actions{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;margin-top:25px}
.dialog-missing{margin-top:13px;background:var(--peach);padding:10px 12px;border-radius:10px;font-size:13px;color:var(--orange-deep)}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(15px);background:var(--ink);color:white;font-size:13px;padding:13px 20px;border-radius:12px;max-width:calc(100% - 28px);width:max-content;z-index:110;box-shadow:0 8px 20px #0002;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.noscript{margin:25px;padding:25px;border:2px solid #bc561b;background:#fff0dc;border-radius:18px}
@media(min-width:1440px){main{padding-top:46px}}
@media(max-width:1050px){
  .hero h1{font-size:43px}.hero{gap:25px}.units-grid{gap:11px}.unit-card{padding:17px 13px 14px}.unit-card h3{font-size:16px}.unit-caption{font-size:11px}
  .strip-stat{padding:0 16px}.study-strip{padding:22px}.hero-side{padding-left:10px}
}
@media(max-width:850px){

unit": 2, "title": "청의 강경책", "prompt": "청이 한족을 통치하기 위해 실시한 강경책 두 가지를 서술하시오.", "answer": "청은 한족의 중화사상을 탄압하고 청 왕조에 대한 비방을 금지하였다. 또한 한족에게 만주족의 풍습인 변발과 호복을 강요하였다.", "criteria": ["중화사상을 탄압하고 청 왕조에 대한 비방을 금지하였다.", "변발과 호복을 강요하였다."], "note": "", "quote": ""}, {"id": 6, "unit": 2, "title": "청의 회유책", "prompt": "청이 한족을 통치하기 위해 실시한 회유책 두 가지를 서술하시오.", "answer": "청은 중요 관직에 만주족과 한족을 함께 등용하였다. 또한 유학 교육을 장려하고 과거제를 실시하였다.", "criteria": ["중요 관직에 만주족과 한족을 함께 등용하였다.", "유학 교육을 장려하고 과거제를 실시하였다."], "note": "", "quote": ""}, {"id": 7, "unit": 2, "title": "강경책과 회유책을 함께 사용한 이유", "prompt": "청이 강경책과 회유책을 함께 사용한 이유를 만주족과 한족의 인구 구성 및 통치 목적과 연결하여 서술하시오.", "answer": "청은 소수의 만주족이 다수의 한족을 지배하는 국가였다. 따라서 강경책으로 저항을 억제하는 한편, 회유책으로 한족의 협력을 얻어 안정적으로 통치하고자 하였다.", "criteria": ["소수의 만주족이 다수의 한족을 지배하였다.", "강경책으로 저항을 억제하고자 하였다.", "회유책으로 협력을 얻어 안정적으로 통치하고자 하였다."], "note": "", "quote": ""}, {"id": 8, "unit": 2, "title": "잘못된 설명 바로잡기", "prompt": "다음 설명이 잘못된 까닭을 만주족의 지위와 한족에 대한 정책을 근거로 서술하시오.", "answer": "청은 한족도 관리로 등용하였지만, 만주족 지배층의 특권을 유지하였다. 또한 한족에게 변발과 호복을 강요하였으므로 두 민족을 모든 면에서 똑같이 대우하였다고 볼 수 없다.", "criteria": ["만주족 지배층의 특권을 유지하였다.", "한족에게 변발과 호복을 강요하였다.", "한족의 관리 등용과 모든 면에서 동등한 대우를 구분하였다."], "note": "", "quote": "“청은 한족을 관리로 등용하였으므로 만주족의 특권을 없애고 두 민족을 모든 면에서 똑같이 대우하였다.”"}, {"id": 9, "unit": 3, "title": "농업 생산력의 증가", "prompt": "명·청 시대에 농업 생산력이 증가한 배경 두 가지와, 그에 따른 인구의 변화를 서술하시오.", "answer": "명·청 시대에는 벼의 품종이 다양해지고 벼농사를 1년에 두 번 지을 수 있는 지역이 늘어났다. 이에 따라 농업 생산력이 증가하였으며 인구도 계속 증가하였다.", "criteria": ["벼의 품종이 다양해졌다.", "벼농사를 1년에 두 번 지을 수 있는 지역이 늘어났다.", "농업 생산력의 증가와 인구 증가를 연결하였다."], "note": "", "quote": ""}, {"id": 10, "unit": 3, "title": "상품 작물과 상공업의 발달", "prompt": "명·청 시대 창장강 하류 지역의 농업과 수공업에 나타난 변화를 연결하여 쓰고, 이러한 변화가 상업에 미친 영향을 서술하시오.", "answer": "창장강 하류 지역에서는 뽕과 면화 등의 상품 작물 재배가 활발해지고, 이를 이용한 비단과 면직물 생산이 발달하였다. 이에 따라 상공업 도시와 정기 시장이 늘어났으며, 상품을 전국으로 유통하는 대상인 집단이 성장하였다.", "criteria": ["뽕과 면화 등 상품 작물의 재배가 활발해졌다.", "상품 작물 재배를 비단·면직물 생산과 연결하였다.", "상공업 도시·정기 시장이 늘어나고 대상인 집단이 성장하였다."], "note": "", "quote": ""}, {"id": 11, "unit": 3, "title": "중국의 수출품과 은의 유입", "prompt": "명·청 시대 중국이 유럽에 수출한 대표적인 상품 세 가지를 쓰고, 유럽 상인들이 상품의 대가로 지급한 물품과 그 주요 생산 지역 두 곳을 서술하시오.", "answer": "중국은 유럽에 비단, 도자기, 차를 수출하였다. 유럽 상인들은 그 대가로 아메리카와 일본에서 생산된 은을 지급하였다.", "criteria": ["수출품으로 비단, 도자기, 차를 모두 썼다.", "대가로 지급한 물품은 은이다.", "은의 주요 생산 지역은 아메리카와 일본이다."], "note": "은을 중국으로 가져온 상인들의 활동 지역과 은이 생산된 지역을 구분한다.", "quote": ""}, {"id": 12, "unit": 3, "title": "유럽 상인들이 은으로 거래한 이유", "prompt": "유럽 상인들이 중국과의 교역에서 은으로 상품의 대가를 지급하는 것이 유리하였던 까닭을 중국의 세금 납부 방식과 은의 가치를 연결하여 서술하시오.", "answer": "중국에서는 세금을 은으로 납부하면서 은의 수요가 많아졌고, 은의 가치가 유럽보다 높았다. 따라서 유럽 상인들은 은을 중국에 가져와 상품의 대가로 지급하는 것이 유리하였다.", "criteria": ["중국에서 세금을 은으로 납부하였다.", "은의 수요 증가와 높은 은의 가치를 연결하였다.", "유럽 상인에게 은으로 지급하는 것이 유리하였음을 설명하였다."], "note": "", "quote": ""}, {"id": 13, "unit": 3, "title": "명과 청의 세금 제도 비교", "prompt": "명과 청의 세금 제도를 비교하여, 납부 수단의 공통점과 토지세·인두세 처리 방식의 차이점을 서술하시오.", "answer": "명과 청은 모두 세금을 은으로 납부하게 하였다. 명은 여러 세금 항목을 정리하여 토지세와 인두세를 은으로 납부하게 하였고, 청은 인두세를 토지세에 통합하여 은으로 납부하게 하였다.", "criteria": ["공통점은 세금을 은으로 납부한 것이다.", "명은 토지세와 인두세를 은으로 납부하게 하였다.", "청은 인두세를 토지세에 통합하였다."], "note": "두 나라가 모두 은으로 세금을 받았다는 사실만으로 세금 제도까지 완전히 같았다고 쓰지 않는다.", "quote": ""}, {"id": 14, "unit": 3, "title": "은의 유입과 세금 제도의 관계", "prompt": "중국에 은이 대량으로 유입된 이후 나타난 경제적 변화를 화폐 사용 → 세금 납부 → 은의 수요의 순서로 서술하시오.", "answer": "중국에 대량으로 들어온 은은 화폐로 사용되었다. 명과 청은 세금을 은으로 납부하도록 제도를 정비하였으며, 이에 따라 은의 수요가 더욱 증가하였다.", "criteria": ["유입된 은이 화폐로 사용되었다.", "세금을 은으로 납부하도록 제도를 정비하였다.", "그 결과 은의 수요가 더욱 증가하였다."], "note": "", "quote": ""}, {"id": 15, "unit": 4, "title": "아메리카 문명의 파괴", "prompt": "신항로 개척 이후 아메리카의 두 제국이 겪은 변화를 두 제국의 이름과 정복한 국가를 포함하여 서술하시오.", "answer": "아메리카에서 독자적인 문명을 발전시켰던 아스테카 제국과 잉카 제국은 총으로 무장한 에스파냐 세력에 정복되었다. 이후 에스파냐의 식민 지배를 받으면서 토착 문명이 파괴되었다.", "criteria": ["아스테카 제국과 잉카 제국을 모두 썼다.", "정복한 국가는 에스파냐이다.", "정복·식민 지배와 토착 문명의 파괴를 연결하였다."], "note": "", "quote": ""}, {"id": 16, "unit": 4, "title": "아메리카에 대한 경제적 수탈", "prompt": "에스파냐가 아메리카를 식민지로 삼은 뒤 부를 얻은 방법 두 가지를 광산과 농장을 중심으로 서술하시오.", "answer": "에스파냐는 원주민을 동원하여 광산에서 금과 은을 채굴하고 수탈하였다. 또한 사탕수수와 담배 등을 재배하는 대농장을 건설하고 생산물을 유럽에 판매하여 부를 얻었다.", "criteria": ["원주민을 동원하여 광산에서 금과 은을 채굴·수탈하였다.", "사탕수수·담배 등의 대농장을 건설하였다.", "대농장 생산물을 유럽에 판매하였다."], "note": "", "quote": ""}, {"id": 17, "unit": 4, "title": "아메리카 원주민의 인구 감소", "prompt": "유럽인의 침입 이후 아메리카 원주민의 인구가 급격히 감소한 원인 두 가지를 서술하시오. 단, 전염병의 구체적인 사례를 포함하시오.", "answer": "아메리카 원주민은 광산과 대농장 등에서 가혹한 노동에 시달렸다. 또한 유럽인이 옮긴 천연두와 홍역 등의 전염병이 퍼지면서 인구가 급격히 감소하였다.", "criteria": ["광산·대농장 등에서의 가혹한 노동을 썼다.", "유럽인이 옮긴 전염병을 썼다.", "천연두·홍역 등 구체적인 전염병 사례를 포함하였다."], "note": "“유럽인에게 정복당했기 때문이다.”라는 설명만으로는 구체적인 원인 두 가지가 드러나지 않는다.", "quote": ""}, {"id": 18, "unit": 4, "title": "노예 무역의 확대", "prompt": "유럽인들이 아프리카인을 아메리카로 강제로 끌고 간 이유를 아메리카 원주민의 인구 변화와 노동력 수요를 연결하여 서술하시오.", "answer": "아메리카 원주민의 인구가 감소하면서 광산 개발과 대농장 경영에 필요한 노동력이 부족해졌다. 이에 유럽인들은 노동력을 확보하기 위해 아프리카인을 노예로 삼아 아메리카로 강제로 이주시켰다.", "criteria": ["아메리카 원주민의 인구가 감소하였다.", "광산·대농장에 필요한 노동력이 부족해졌다.", "노동력 확보를 위해 아프리카인을 강제 이주시켰다."], "note": "", "quote": ""}, {"id": 19, "unit": 4, "title": "노예 무역이 아프리카에 미친 영향", "prompt": "노예 무역의 확대가 아프리카 사회에 미친 영향을 인구 규모와 인구 구성의 측면에서 각각 서술하시오.", "answer": "노예 무역으로 많은 아프리카인이 강제로 끌려가고 희생되면서 아프리카의 인구가 감소하였다. 또한 남녀 성비가 불균형해졌다.", "criteria": ["아프리카의 인구가 감소하였다.", "남녀 성비가 불균형해졌다."], "note": "이 문제는 아메리카가 아니라 아프리카에 나타난 변화를 묻는다.", "quote": ""}, {"id": 20, "unit": 5, "title": "재정·군사 국가의 의미", "prompt": "재정·군사 국가의 의미를 군사력, 세금 제도, 행정 기구를 모두 포함하여 서술하시오.", "answer": "재정·군사 국가는 강력한 군사력을 유지하기 위해 효율적인 세금 제도와 중앙 행정 기구를 갖춘 국가이다.", "criteria": ["강력한 군사력을 유지하려는 목적을 썼다.", "효율적인 세금 제도를 썼다.", "중앙 행정 기구를 썼다."], "note": "", "quote": ""}, {"id": 21, "unit": 5, "title": "상비군과 재정의 관계", "prompt": "재정·군사 국가가 세금 제도를 정비한 이유를 상비군의 유지 비용과 연결하여 서술하시오.", "answer": "상비군은 항상 유지해야 하는 군대이므로 군인에게 지급할 급료 등 많은 비용이 필요하였다. 재정·군사 국가는 이러한 군대 유지 비용을 마련하기 위해 세금 제도를 정비하였다.", "criteria": ["상비군은 항상 유지해야 하는 군대이다.", "급료 등 지속적인 유지 비용이 필요하였다.", "유지 비용을 마련하기 위해 세금 제도를 정비하였다."], "note": "", "quote": ""}, {"id": 22, "unit": 5, "title": "잦은 전쟁에 따른 변화", "prompt": "16~18세기 유럽의 잦은 전쟁이 재정·군사 국가에 미친 영향을 군대 규모, 재정 부담, 군사 기술의 측면에서 서술하시오.", "answer": "잦은 전쟁으로 군대의 규모가 확대되면서 군대를 유지하는 데 드는 비용도 증가하였다. 또한 전쟁을 치르는 과정에서 다양한 군사 기술이 발달하였다.", "criteria": ["군대의 규모가 확대되었다.", "군대 유지 비용이 증가하였다.", "다양한 군사 기술이 발달하였다."], "note": "", "quote": ""}, {"id": 23, "unit": 5, "title": "중상주의 정책", "prompt": "재정·군사 국가가 실시한 중상주의 정책의 내용을 수출, 수입, 식민지를 모두 포함하여 서술하시오.", "answer": "재정·군사 국가는 수출을 장려하고 관세를 높여 수입을 줄이는 중상주의 정책을 실시하였다. 또한 원료를 얻고 상품을 판매할 시장을 확보하기 위해 식민지를 확대하였다.", "criteria": ["수출을 장려하였다.", "관세를 높여 수입을 억제하였다.", "원료와 상품 판매 시장을 확보하기 위해 식민지를 확대하였다."], "note": "", "quote": ""}, {"id": 24, "unit": 5, "title": "국가와 상공 시민 계층의 관계", "prompt": "재정·군사 국가와 상공 시민 계층이 어떤 도움을 주고받았는지 서술하시오.", "answer": "국가는 상공 시민 계층의 상공업 활동을 보호하였다. 상공 시민 계층은 그 대가로 국가에 재정적 지원을 제공하였다.", "criteria": ["국가는 상공 시민 계층의 상공업 활동을 보호하였다.", "상공 시민 계층은 국가에 재정적 지원을 제공하였다."], "note": "", "quote": ""}, {"id": 25, "unit": 5, "title": "영국과 프랑스의 차이", "prompt": "영국과 프랑스가 재정·군사 국가를 운영한 방식의 차이를 국왕과 의회의 관계를 중심으로 서술하시오.", "answer": "영국에서는 국왕과 의회가 서로 협력하면서 재정·군사 국가가 성장하였다. 반면 프랑스에서는 국왕이 절대적인 힘을 내세우고 의회를 억누르며 국가를 운영하였다.", "criteria": ["영국에서는 국왕과 의회가 협력하였다.", "프랑스에서는 국왕이 강한 권력을 행사하며 의회를 억눌렀다."], "note": "재정·군사 국가가 모두 똑같은 정치 운영 방식을 취한 것은 아니다.", "quote": ""}]}</script>
<script>
/* 역사 한 문장: 외부 라이브러리 없이 동작하는 서답형 연습 앱.
   답안 내용은 자동 채점하지 않습니다. 제출 후 사람이 모범답안과 비교합니다.
   단일 HTML 배포본에는 동일한 CSS/JS/문제 데이터가 포함됩니다. */
(() => {
  "use strict";
  const { units, questions } = JSON.parse(document.getElementById("quiz-data").textContent);
  const byId = new Map(questions.map(q => [q.id, q]));
  const byUnit = new Map(units.map(u => [u.id, u]));
  const STORE_KEY = "history-one-sentence-written-v1";
  const app = document.getElementById("app");
  const dialog = document.getElementById("confirm-dialog");
  const gradeNames = { good: "잘 썼어요", improve: "보완할래요", retry: "다시 연습" };
  const state = load();
  let view = "home", currentKey = null, filter = "all";
  let saveTimer, toastTimer, dialogCallback = null, storageWarned = false;

  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function icon(name) { return `<svg class="icon" aria-hidden="true"><use href="#i-${name}"></use></svg>`; }
  function pad(n) { return String(n).padStart(2, "0"); }
  function plainObject(v) { return v && typeof v === "object" && !Array.isArray(v); }
  function load() {
    const clean = { version: 1, sessions: {}, lastSession: null };
    try {
      const raw = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
      if (!raw || raw.version !== 1 || !plainObject(raw.sessions)) return clean;
      for (const [key, value] of Object.entries(raw.sessions)) {
        if (!/^(all|unit-[1-5]|review-\d+)$/.test(key) || !plainObject(value)) continue;
        if (!Array.isArray(value.ids)) continue;
        let ids = [...new Set(value.ids)].filter(id => Number.isInteger(id) && byId.has(id));
        if (key === "all") ids = questions.map(q => q.id);
        if (key.startsWith("unit-")) ids = questions.filter(q => q.unit === Number(key.slice(5))).map(q => q.id);
        if (!ids.length) continue;
        const session = {
          ids, label: typeof value.label === "string" ? value.label.slice(0, 100) : "문제 풀이",
          answers: {}, flags: {}, ratings: {}, checks: {}, notes: {},
          index: Math.min(ids.length - 1, Math.max(0, Number.isInteger(value.index) ? value.index : 0)),
          submitted: value.submitted === true,
          createdAt: typeof value.createdAt === "string" ? value.createdAt : new Date().toISOString(),
          submittedAt: typeof value.submittedAt === "string" ? value.submittedAt : null
        };
        for (const id of ids) {
          const answer = value.answers?.[id];
          session.answers[id] = typeof answer === "string" ? answer.slice(0, 4000) : "";
          session.flags[id] = value.flags?.[id] === true;
          if (Object.hasOwn(gradeNames, value.ratings?.[id])) session.ratings[id] = value.ratings[id];
          session.checks[id] = byId.get(id).criteria.map((_, i) => value.checks?.[id]?.[i] === true);
          session.notes[id] = typeof value.notes?.[id] === "string" ? value.notes[id].slice(0, 4000) : "";
        }
        if (session.submitted && !ids.every(id => session.answers[id].trim())) session.submitted = false;
        clean.sessions[key] = session;
      }
      if (Object.hasOwn(clean.sessions, raw.lastSession)) clean.lastSession = raw.lastSession;
    } catch (_) { /* 저장 공간이 차단되거나 손상되어도 문제 풀이를 시작할 수 있습니다. */ }
    return clean;
  }
  function save() {
    clearTimeout(saveTimer);
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      setSaveStatus("이 기기에 자동 저장", false);
      return true;
    } catch (_) {
      setSaveStatus("자동 저장 불가 · 창 유지", true);
      if (!storageWarned) {
        storageWarned = true;
        toast("자동 저장이 제한되어 있어요. 창을 닫지 말고, 제출 후 결과를 파일로 저장해 주세요.", 6500);
      }
      return false;
    }
  }
  function queueSave() {
    setSaveStatus("답안 저장 중…", false);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 350);
  }
  function setSaveStatus(text, warning) {
    const el = document.getElementById("save-status");
    el.classList.toggle("warn", warning);
    el.querySelector(".save-text").textContent = text;
  }
  function toast(message, duration = 3000) {
    const el = document.getElementById("toast");
    clearTimeout(toastTimer);
    el.textContent = message;
    el.classList.add("show");
    toastTimer = setTimeout(() => el.classList.remove("show"), duration);
  }
  function newSession(ids, label) {
    return {
      ids: [...ids], label, answers: {}, flags: {}, ratings: {}, checks: {}, notes: {},
      index: 0, submitted: false, createdAt: new Date().toISOString(), submittedAt: null
    };
  }
  function active() { return state.sessions[currentKey]; }
  function answered(s) { return s ? s.ids.filter(id => (s.answers[id] || "").trim()).length : 0; }
  function hasEnding(answer) {

  function countRatings(s) {
    const counts = { good: 0, improve: 0, retry: 0, pending: 0 };

    document.getElementById("dialog-cancel").textContent = cancel;

    if (typeof dialog.showModal === "function") {

      document.getElementById("dialog-cancel").focus();

      const fn = dialogCallback; dialogCallback = null; fn?.();

  document.getElementById("dialog-confirm").addEventListener("click", () => {
    const fn = dialogCallback; dialogCallback = null; dialog.close(); fn?.();

  function start(key) {

      else if (/^unit-[1-5]$/.test(key)) {
        const u = byUnit.get(Number(key.slice(5)));
        ids = questions.filter(q => q.unit === u.id).map(q => q.id);
        label = u.title;
      } else return;
      state.sessions[key] = newSession(ids, label);
    }
    currentKey = key; state.lastSession = key; filter = "all";
    save();
    if (active().submitted) renderResults();
    else renderPractice();
    top();
  }

      <details class="improve-note"${s.notes[q.id] ? " open" : ""}>
        <summary>고쳐 쓸 문장 메모하기</summary>
        <label class="sr-only" for="note-${q.id}">${q.id}번 보완 답안 메모</label>
        <textarea class="improve-input" id="note-${q.id}" data-note="${q.id}" maxlength="4000" placeholder="빠뜨린 내용을 넣어 답안을 다시 써 보세요. 제출한 원래 답안은 그대로 남아요.">${esc(s.notes[q.id] || "")}</textarea>
      </details>
    </article>`;
  }
  function renderResults() {
    const s = active();
    if (!s || !s.submitted) return s ? renderPractice() : renderHome();
    view = "results";
    app.innerHTML = `
      <div class="page-topline"><button class="link-button" data-action="home">${icon("left")} 범위 선택으로</button><span class="small-note">${s.ids.length}문제 제출 완료</span></div>
      <section class="results-heading">
        <span class="eyebrow pill">${icon("check")} 답안 비교 & 자기 점검</span>
        <h1>이제, 내 문장을 돌아볼 시간.</h1>
        <p><strong>${esc(s.label)}</strong> · 표현이 똑같지 않아도 괜찮아요. 핵심 내용과 원인·결과가 담겼는지 비교하고, 각 문제를 직접 평가해 보세요.</p>
      </section>
      <div class="self-summary" id="self-summary" aria-label="자기 점검 현황">${summaryHTML(s)}</div>
      <p class="summary-caption">위 숫자는 직접 선택한 자기평가 현황이에요. 자동 채점 점수나 학교의 배점표가 아니에요.</p>
      <div class="results-toolbar">
        <button class="btn primary" data-action="retry-weak">${icon("retry")} 보완 문제 다시 풀기</button>
        <button class="btn" data-action="download">${icon("save")} 결과 저장</button>
        <button class="btn" data-action="print">${icon("print")} 인쇄</button>
        <button class="btn ghost" data-action="reset">${icon("retry")} 이 연습 처음부터</button>
      </div>
      <div class="result-filter-row">
        <div class="filter-bar" role="group" aria-label="결과 필터">
          ${[["all", "전체"], ["review", "보완 · 다시 연습"], ["pending", "아직 점검 전"], ["flagged", "표시한 문제"]].map(([key, label]) =>
            `<button class="filter-btn${filter === key ? " active" : ""}" data-action="filter" data-filter="${key}" aria-pressed="${filter === key}">${label}</button>`).join("")}
        </div>
        <span class="filtered-count" id="filtered-count"></span>
      </div>
      <div class="result-list" id="result-list"></div>
      <div class="results-bottom"><button class="btn" data-action="home">${icon("book")} 다른 범위 연습하기</button><button class="btn light" data-action="top">맨 위로${icon("arrow")}</button></div>`;
    updateResultList();
  }
  function updateResultList() {
    const s = active(), ids = visibleIds(s);
    document.getElementById("filtered-count").textContent = `${ids.length} / ${s.ids.length}문제`;
    document.getElementById("result-list").innerHTML = ids.length
      ? ids.map(id => cardHTML(byId.get(id), s)).join("")
      : `<section class="empty-state"><h2>이 조건에 해당하는 문제가 없어요.</h2><p>전체 결과에서 답안을 비교하거나, 각 문제의 자기평가를 선택해 주세요.</p><button class="btn light" data-action="filter" data-filter="all">전체 결과 보기</button></section>`;
    document.querySelectorAll(".filter-btn").forEach(button => {
      const selected = button.dataset.filter === filter;
      button.classList.toggle("active", selected);
      button.setAttribute("aria-pressed", selected);
    });
  }
  function updateGradeHint(id) {
    const s = active(), q = byId.get(id), n = (s.checks[id] || []).filter(Boolean).length;
    const el = document.getElementById(`grade-hint-${id}`);
    if (el) el.hidden = s.ratings[id] !== "good" || n === q.criteria.length;
  }
  function setGrade(id, grade) {
    const s = active();
    if (!s?.submitted || !s.ids.includes(id) || !Object.hasOwn(gradeNames, grade)) return;
    if (s.ratings[id] === grade) delete s.ratings[id]; else s.ratings[id] = grade;
    save();
    document.getElementById("self-summary").innerHTML = summaryHTML(s);
    if (filter === "pending" || filter === "review") updateResultList();
    else {
      const buttons = document.getElementById(`grade-buttons-${id}`);
      buttons.querySelectorAll(".grade-btn").forEach(btn => {
        const selected = btn.dataset.grade === s.ratings[id];
        btn.classList.toggle("selected", selected); btn.setAttribute("aria-pressed", selected);
      });
      updateGradeHint(id);
    }
  }
  function toggleFlag(id) {
    const s = active();
    if (!s || !s.ids.includes(id)) return;
    s.flags[id] = !s.flags[id]; save();
    if (view === "practice") {
      const btn = document.querySelector(`.flag-btn[data-id="${id}"]`);
      btn?.classList.toggle("active", s.flags[id]);
      btn?.setAttribute("aria-pressed", s.flags[id]);
      refreshProgress();
    } else if (view === "results") {
      if (filter === "flagged") updateResultList();
      else {
        const btn = document.querySelector(`.flag-btn[data-id="${id}"]`);
        btn?.classList.toggle("active", s.flags[id]); btn?.setAttribute("aria-pressed", s.flags[id]);
      }
    }
  }
  function resetCurrent() {
    const s = active();
    if (!s) return;
    showDialog({
      title: "이 연습을 처음부터 다시 풀까요?",
      text: "현재 연습의 답안과 자기 점검 기록이 삭제됩니다. 다른 범위의 기록은 유지돼요.\n남겨 두고 싶은 결과는 먼저 ‘결과 저장’으로 보관해 주세요.",
      confirm: "기록 지우고 다시 풀기", cancel: "기록 유지하기", danger: true,
      onConfirm: () => {
        state.sessions[currentKey] = newSession(s.ids, s.label);
        save(); renderPractice(); top();
      }
    });
  }
  function retryWeak() {
    const s = active();
    if (!s?.submitted) return;
    const ids = s.ids.filter(id => ["improve", "retry"].includes(s.ratings[id]));
    if (!ids.length) {
      toast("먼저 연습할 문제에 ‘보완할래요’ 또는 ‘다시 연습’을 선택해 주세요.", 4500);
      return;
    }
    showDialog({
      title: `${ids.length}문제를 다시 써 볼까요?`,
      text: "‘보완할래요’와 ‘다시 연습’으로 고른 문제만 새 답안으로 연습해요.\n현재 결과는 그대로 보관되고, 새 연습을 모두 제출할 때까지 모범답안은 보이지 않아요.",
      confirm: "새로 연습하기",
      onConfirm: () => {
        currentKey = `review-${Date.now()}`;
        state.sessions[currentKey] = newSession(ids, `보완 문제 ${ids.length}개 다시 풀기`);
        state.lastSession = currentKey; filter = "all";
        save(); renderPractice(); top();
      }
    });
  }
  function downloadResults() {
    const s = active();
    if (!s?.submitted) return;
    const counts = countRatings(s);
    const lines = [
      "역사 한 문장 · 서답형 연습 결과", s.label,
      `제출 시각: ${new Date(s.submittedAt || Date.now()).toLocaleString("ko-KR")}`,
      `잘 썼어요 ${counts.good} / 보완할래요 ${counts.improve} / 다시 연습 ${counts.retry} / 점검 전 ${counts.pending}`,
      "※ 자동 채점 결과가 아닌 자기평가 기록이며, 공식 학교 채점 기준이 아닙니다.", ""
    ];
    for (const id of s.ids) {
      const q = byId.get(id), u = byUnit.get(q.unit);
      lines.push("=".repeat(55), `문제 ${pad(id)} · ${u.title} · 교과서 ${u.page}쪽`, q.prompt);
      if (q.quote) lines.push(q.quote);
      lines.push("", "[내 답안]", s.answers[id] || "", "", "[모범답안]", q.answer, "", "[핵심 내용 확인]");
      q.criteria.forEach((c, i) => lines.push(`${s.checks[id]?.[i] ? "[✓]" : "[ ]"} ${c}`));
      if (q.note) lines.push(`[주의할 점] ${q.note}`);
      lines.push(`[자기평가] ${gradeNames[s.ratings[id]] || "아직 점검 전"}`);
      if (s.flags[id]) lines.push("[다시 볼 문제로 표시함]");
      if (s.notes[id]) lines.push("", "[고쳐 쓸 문장 메모]", s.notes[id]);
      lines.push("");
    }
    const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
    a.href = url; a.download = `역사_서답형_결과_${stamp}.txt`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    toast("결과 파일에 내 답안·모범답안·자기 점검을 함께 저장했어요.");
  }

  document.addEventListener("click", e => {
    const btn = e.target.closest("button[data-action]");
    if (!btn || btn.disabled) return;
    const action = btn.dataset.action;
    switch (action) {
      case "home": save(); renderHome(); top(); break;
      case "start": start(btn.dataset.key); break;
      case "resume": if (state.lastSession) start(state.lastSession); break;
      case "goto": go(Number(btn.dataset.index)); break;
      case "prev": if (active()) go(active().index - 1); break;
      case "next": if (active()) go(active().index + 1); break;
      case "flag": toggleFlag(Number(btn.dataset.id)); break;
      case "submit": requestSubmit(); break;
      case "grade": setGrade(Number(btn.dataset.id), btn.dataset.grade); break;
      case "filter": if (["all", "review", "pending", "flagged"].includes(btn.dataset.filter)) { filter = btn.dataset.filter; updateResultList(); } break;
      case "reset": resetCurrent(); break;
      case "retry-weak": retryWeak(); break;
      case "download": downloadResults(); break;
      case "print": window.print(); break;
      case "top": top(); break;
    }
  });
  document.addEventListener("input", e => {
    const target = e.target, s = active();
    if (!s) return;
    if (target.matches("textarea[data-answer]") && !s.submitted) {
      const id = Number(target.dataset.answer);
      if (!s.ids.includes(id)) return;
      s.answers[id] = target.value.slice(0, 4000);
      document.getElementById("answer-format").innerHTML = endingText(target.value);
      document.getElementById("answer-length").textContent = `${target.value.length} / 4,000자`;
      refreshProgress(); queueSave();
    } else if (target.matches("textarea[data-note]") && s.submitted) {
      const id = Number(target.dataset.note);
      if (s.ids.includes(id)) { s.notes[id] = target.value.slice(0, 4000); queueSave(); }
    }
  });
  document.addEventListener("change", e => {
    const target = e.target, s = active();
    if (!target.matches("input[data-criterion]") || !s?.submitted) return;
    const id = Number(target.dataset.id), idx = Number(target.dataset.criterion), q = byId.get(id);
    if (!s.ids.includes(id) || !q || idx < 0 || idx >= q.criteria.length) return;
    if (!s.checks[id]) s.checks[id] = q.criteria.map(() => false);
    s.checks[id][idx] = target.checked; save();
    document.getElementById(`criteria-count-${id}`).textContent = `${s.checks[id].filter(Boolean).length}/${q.criteria.length}`;
    updateGradeHint(id);
  });
  window.addEventListener("beforeunload", save);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") save(); });
  renderHome(); save();
})();

</script>
</body>
</html>
