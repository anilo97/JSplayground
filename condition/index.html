<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>조건문 연습</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><span class="eyebrow">CONDITION</span><h1 id="unitTitle">조건문 연습</h1></div><p><span id="learnerText" class="learner"></span><strong id="progressText"></strong> 문제</p></header><div class="progress"><span id="progressBar"></span></div>
<section id="teacherBar" class="teacher-bar" hidden><strong>교사용</strong><button id="teacherPrev" type="button">이전 문제</button><button id="showSolution" type="button">정답 보기</button><button id="teacherNext" type="button">다음 문제</button></section>
<main id="practice"><section class="problem-card"><span class="number" id="problemNumber"></span><h2 id="problemTitle"></h2><p id="description" class="description"></p><div class="starter"><span>제공 코드</span><pre><code id="starterCode"></code></pre></div><div class="conditions"><h3>조건</h3><ul id="conditionList"></ul></div><div class="output"><span>출력 결과</span><pre id="expectedOutput"></pre></div></section>
<section class="answer-card"><div class="editor-title"><h3>코드 작성</h3><button id="resetButton" type="button">초기화</button></div><div class="editor"><div id="lineNumbers" aria-hidden="true">1</div><textarea id="codeInput" aria-label="JavaScript 답안 입력" spellcheck="false"></textarea></div><div class="actions"><p id="feedback" role="status" aria-live="polite"></p><button id="submitButton" type="button">정답 확인</button></div><div id="solutionPanel" class="solution-panel" hidden><div><strong>정답 코드</strong><button id="copySolution" type="button">복사</button></div><pre><code id="solutionCode"></code></pre></div></section></main>
<section id="completion" class="completion" hidden><div id="watermark" class="watermark" aria-hidden="true"></div><div class="completion-content"><div class="check">✓</div><h2 id="completeTitle"></h2><p class="student-complete"><strong id="completeStudent"></strong> 학생이<br><span id="completeCount"></span>개의 문제를 모두 해결했습니다.</p><dl><div><dt>완료 시각</dt><dd id="completedAt"></dd></div><div><dt>완료 코드</dt><dd id="completionCode"></dd></div></dl><button id="restartButton" type="button">처음부터 다시 풀기</button></div></section>
<script src="script.js"></script></body></html>
