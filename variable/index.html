<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>변수 연습</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div><span class="eyebrow">VARIABLE</span><h1>변수 연습</h1></div>
    <p><strong id="progressText">1 / 8</strong> 문제</p>
  </header>
  <div class="progress"><span id="progressBar"></span></div>

  <section id="teacherBar" class="teacher-bar" hidden>
    <strong>교사용</strong>
    <button id="teacherPrev" type="button">이전 문제</button>
    <button id="showSolution" type="button">정답 보기</button>
    <button id="teacherNext" type="button">다음 문제</button>
  </section>

  <main id="practice">
    <section class="problem-card">
      <span class="number" id="problemNumber"></span>
      <h2 id="problemTitle"></h2>
      <p id="description" class="description"></p>
      <div id="starterBox" class="starter" hidden><span>제공 코드</span><pre><code id="starterCode"></code></pre></div>
      <div class="conditions"><h3>조건</h3><ul id="conditionList"></ul></div>
      <div class="output"><span>출력 결과</span><pre id="expectedOutput"></pre></div>
    </section>

    <section class="answer-card">
      <div class="editor-title"><h3>코드 작성</h3><button id="resetButton" type="button">초기화</button></div>
      <div class="editor"><div id="lineNumbers" aria-hidden="true">1</div><textarea id="codeInput" aria-label="JavaScript 답안 입력" spellcheck="false"></textarea></div>
      <div class="actions"><p id="feedback" role="status" aria-live="polite"></p><button id="submitButton" type="button">정답 확인</button></div>
      <div id="solutionPanel" class="solution-panel" hidden>
        <div><strong>정답 코드</strong><button id="copySolution" type="button">복사</button></div>
        <pre><code id="solutionCode"></code></pre>
      </div>
    </section>
  </main>

  <section id="completion" class="completion" hidden>
    <div class="check">✓</div><h2>변수 연습을 모두 마쳤습니다!</h2><p>8개의 문제를 모두 정확하게 해결했습니다.</p><button id="restartButton" type="button">처음부터 다시 풀기</button>
  </section>
  <script src="script.js"></script>
</body>
</html>
