<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JavaScript 단원별 문제 풀이 사이트" />
    <title>JS Playground</title>    
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <a class="brand" href="./" aria-label="JS Playground 홈">
          <span class="brand-mark">JS</span>
          <span><strong>JS Playground</strong><small>문제 풀이</small></span>
        </a>

        <nav aria-label="단원 선택">
          <p class="nav-label">학습 단원</p>
          <div id="moduleMenu"></div>
        </nav>

        <div id="studentBadge" class="student-badge" hidden>
          <span>학습자</span><strong id="studentNumberText"></strong>
        </div>

        <button id="teacherLoginButton" class="teacher-login material-logo" type="button" aria-label="자료 불러오기">
          <svg viewBox="0 0 40 40" width="36" height="36" aria-hidden="true" focusable="false">
            <rect x="2" y="2" width="36" height="36" rx="12" fill="currentColor" opacity=".09"/>
            <path d="M20 9 31 15.5 20 22 9 15.5Z" fill="currentColor"/>
            <path d="m10 22 10 6 10-6M10 28l10 6 10-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div id="teacherStatus" class="teacher-status" hidden>
          <span>자료 연결됨</span>
          <button id="teacherLogoutButton" type="button">연결 해제</button>
        </div>
        <p class="sidebar-note">
          문제를 맞혀야 다음 문제로 넘어갈 수 있습니다.
        </p>
      </aside>

      <main class="content">
        <div class="mobile-header">
          <span class="brand-mark">JS</span>
          <strong>JS Playground</strong>
        </div>
        <iframe id="practiceFrame" title="문제 풀이 영역"></iframe>
      </main>
    </div>

    <dialog id="studentDialog" class="teacher-dialog student-dialog">
      <form id="studentForm">
        <div class="dialog-heading"><h2>학번 확인</h2></div>
        <p>완료 화면에 표시할 본인의 학번을 입력하세요.</p>
        <label for="studentNumber">학번</label>
        <input
          id="studentNumber"
          type="text"
          inputmode="numeric"
          maxlength="4"
          placeholder="예: 2302"
          autocomplete="off"
        />
        <p id="studentFeedback" class="login-feedback" role="status"></p>
        <button class="dialog-submit" type="submit">문제 풀기 시작</button>
      </form>
    </dialog>

    <dialog id="teacherDialog" class="teacher-dialog">
      <form method="dialog" id="teacherForm">
        <div class="dialog-heading">
          <h2>자료 불러오기</h2>
          <button
            id="dialogCloseButton"
            class="dialog-close"
            type="button"
            aria-label="닫기"
          >
            ×
          </button>
        </div>
<input id="teacherSolutionFile" aria-label="파일 선택" type="file" accept=".json,application/json" />
<p id="loginFeedback" class="login-feedback" role="status"></p>
        <button class="dialog-submit" type="submit">확인</button>
      </form>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
